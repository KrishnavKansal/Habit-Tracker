<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Habit Tracker</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css" />
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #ffffff;
    --bg-secondary: #f5f5f4;
    --bg-tertiary: #eeece8;
    --text: #1c1c1a;
    --text-secondary: #6b6b68;
    --text-tertiary: #9c9c99;
    --border: rgba(0,0,0,0.12);
    --border-hover: rgba(0,0,0,0.25);
    --accent: #1D9E75;
    --accent-light: #E1F5EE;
    --accent-text: #0F6E56;
    --info-bg: #E6F1FB;
    --info-border: rgba(24,95,165,0.3);
    --info-text: #185FA5;
    --danger-bg: #FCEBEB;
    --danger-border: rgba(163,45,45,0.3);
    --danger-text: #A32D2D;
    --radius-md: 8px;
    --radius-lg: 12px;
    --radius-xl: 16px;
    --shadow: 0 1px 4px rgba(0,0,0,0.08), 0 4px 16px rgba(0,0,0,0.06);
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1c1c1a;
      --bg-secondary: #252522;
      --bg-tertiary: #2e2e2b;
      --text: #f0ede8;
      --text-secondary: #9c9c99;
      --text-tertiary: #6b6b68;
      --border: rgba(255,255,255,0.1);
      --border-hover: rgba(255,255,255,0.2);
      --accent: #1D9E75;
      --accent-light: #04342C;
      --accent-text: #5DCAA5;
      --info-bg: #042C53;
      --info-border: rgba(133,183,235,0.25);
      --info-text: #85B7EB;
      --danger-bg: #501313;
      --danger-border: rgba(240,149,149,0.25);
      --danger-text: #F09595;
      --shadow: 0 1px 4px rgba(0,0,0,0.3), 0 4px 16px rgba(0,0,0,0.25);
    }
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: var(--bg-tertiary);
    color: var(--text);
    min-height: 100vh;
    line-height: 1.5;
  }

  .app-shell { max-width: 1200px; margin: 0 auto; padding: 24px 16px 48px; }

  .app-header {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 24px; flex-wrap: wrap; gap: 12px;
  }

  .app-title { font-size: 22px; font-weight: 500; color: var(--text); display: flex; align-items: center; gap: 8px; }
  .app-title i { color: var(--accent); font-size: 24px; }

  .card { background: var(--bg); border-radius: var(--radius-lg); border: 0.5px solid var(--border); box-shadow: var(--shadow); }
  .card-inner { padding: 20px; }

  .section-header { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px; margin-bottom: 20px; }
  .month-nav { display: flex; align-items: center; gap: 8px; }
  .month-label { font-size: 18px; font-weight: 500; color: var(--text); min-width: 170px; text-align: center; }

  .btn {
    background: transparent; border: 0.5px solid var(--border-hover); border-radius: var(--radius-md);
    padding: 7px 13px; cursor: pointer; font-size: 13px; color: var(--text);
    display: inline-flex; align-items: center; gap: 5px;
    transition: background .15s, border-color .15s; font-family: inherit;
  }
  .btn:hover { background: var(--bg-secondary); }
  .btn:active { transform: scale(0.98); }
  .btn-accent { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 500; }
  .btn-accent:hover { opacity: .88; background: var(--accent); }
  .btn-ghost { border-color: transparent; padding: 5px 8px; }
  .btn-danger { color: var(--danger-text); border-color: var(--danger-border); }
  .btn-danger:hover { background: var(--danger-bg); }

  .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; margin-bottom: 20px; }
  .stat { background: var(--bg-secondary); border-radius: var(--radius-md); padding: 12px 14px; }
  .stat-label { font-size: 12px; color: var(--text-secondary); margin-bottom: 4px; }
  .stat-val { font-size: 22px; font-weight: 500; color: var(--text); }

  .table-wrap { overflow-x: auto; border: 0.5px solid var(--border); border-radius: var(--radius-lg); }
  table { border-collapse: collapse; width: 100%; min-width: 560px; }

  thead th {
    font-size: 11px; font-weight: 500; color: var(--text-secondary);
    padding: 7px 4px; text-align: center; border-bottom: 0.5px solid var(--border);
    background: var(--bg-secondary); position: sticky; top: 0; z-index: 2;
  }
  thead th.habit-col {
    text-align: left; padding-left: 14px; min-width: 170px;
    position: sticky; left: 0; z-index: 3; border-right: 0.5px solid var(--border);
  }

  tbody tr { border-bottom: 0.5px solid var(--border); }
  tbody tr:last-child { border-bottom: none; }
  tbody tr:hover td { background: var(--bg-secondary); }
  td { padding: 4px 3px; text-align: center; vertical-align: middle; }
  td.habit-cell {
    text-align: left; padding: 8px 14px; position: sticky; left: 0;
    background: var(--bg); border-right: 0.5px solid var(--border); z-index: 1; min-width: 170px;
  }
  tbody tr:hover td.habit-cell { background: var(--bg-secondary); }

  .habit-name-row { display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 500; color: var(--text); }
  .drag-handle { cursor: grab; color: var(--text-tertiary); font-size: 14px; flex-shrink: 0; }
  .drag-handle:active { cursor: grabbing; }
  .habit-sub { font-size: 11px; color: var(--text-tertiary); margin-top: 1px; padding-left: 20px; }
  .habit-actions { display: none; gap: 3px; margin-left: auto; }
  td.habit-cell:hover .habit-actions { display: flex; }

  .cb {
    width: 22px; height: 22px; border: 0.5px solid var(--border-hover); border-radius: 4px;
    cursor: pointer; display: inline-flex; align-items: center; justify-content: center;
    transition: all .1s; background: transparent; flex-shrink: 0; font-size: 14px;
  }
  .cb.checked { background: var(--accent); border-color: var(--accent); color: #fff; }
  .cb.na { background: var(--bg-secondary); border-color: var(--border); cursor: default; opacity: .35; }
  .cb.today-col { border-color: var(--accent); border-width: 1.5px; }
  .today-header { color: var(--accent) !important; font-weight: 600 !important; }

  .progress-cell { padding: 6px 10px; min-width: 84px; }
  .progress-bar-wrap { background: var(--bg-tertiary); border-radius: 8px; height: 5px; overflow: hidden; }
  .progress-bar { height: 100%; border-radius: 8px; background: var(--accent); transition: width .3s; }
  .pct-label { font-size: 11px; color: var(--text-secondary); margin-top: 3px; }

  .modal-bg { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.5); z-index: 200; align-items: center; justify-content: center; padding: 16px; }
  .modal-bg.open { display: flex; }
  .modal { background: var(--bg); border: 0.5px solid var(--border-hover); border-radius: var(--radius-xl); padding: 24px; width: min(440px, 100%); max-height: 85vh; overflow-y: auto; box-shadow: var(--shadow); }
  .modal h2 { font-size: 16px; font-weight: 500; margin-bottom: 18px; color: var(--text); }
  .field { margin-bottom: 14px; }
  .field label { font-size: 12px; color: var(--text-secondary); display: block; margin-bottom: 5px; }
  input[type="text"] { width: 100%; padding: 8px 12px; border: 0.5px solid var(--border-hover); border-radius: var(--radius-md); font-size: 14px; background: var(--bg); color: var(--text); font-family: inherit; outline: none; transition: border-color .15s, box-shadow .15s; }
  input[type="text"]:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(29,158,117,0.15); }
  .day-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
  .day-btn { background: transparent; border: 0.5px solid var(--border-hover); border-radius: 6px; padding: 7px 4px; cursor: pointer; font-size: 12px; color: var(--text-secondary); text-align: center; transition: all .15s; font-family: inherit; }
  .day-btn.active { background: var(--accent-light); border-color: var(--accent); color: var(--accent-text); font-weight: 500; }
  .day-btn:hover:not(.active) { background: var(--bg-secondary); }
  .field-hint { font-size: 11px; color: var(--text-tertiary); margin-top: 5px; }
  .modal-footer { display: flex; justify-content: flex-end; gap: 8px; margin-top: 18px; padding-top: 14px; border-top: 0.5px solid var(--border); }

  .empty-state { text-align: center; padding: 40px 20px; color: var(--text-secondary); }
  .empty-state i { font-size: 36px; color: var(--text-tertiary); margin-bottom: 10px; display: block; }
  .empty-state p { font-size: 14px; }
  .drag-over { background: var(--info-bg) !important; }
  .drag-over td { background: var(--info-bg) !important; }

  .sync-status { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; color: var(--text-tertiary); padding: 4px 10px; border-radius: 20px; background: var(--bg-secondary); border: 0.5px solid var(--border); }
  .sync-status.syncing { color: var(--info-text); background: var(--info-bg); border-color: var(--info-border); }
  .sync-status.synced  { color: var(--accent-text); background: var(--accent-light); border-color: var(--accent); }
  .sync-status.error   { color: var(--danger-text); background: var(--danger-bg); border-color: var(--danger-border); }

  .loading-overlay {
    position: fixed; inset: 0; background: var(--bg-tertiary);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 14px; z-index: 999; font-size: 14px; color: var(--text-secondary);
  }
  .loading-overlay i { font-size: 36px; color: var(--accent); animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  @media (max-width: 600px) {
    .app-title span { display: none; }
    .month-label { min-width: 120px; font-size: 15px; }
  }
</style>
</head>
<body>

<div class="loading-overlay" id="loading-overlay">
  <i class="ti ti-loader-2"></i>
  <span>Loading your habits…</span>
</div>

<div class="app-shell">
  <header class="app-header">
    <div class="app-title">
      <i class="ti ti-checkbox"></i>
      <span>Habit Tracker</span>
    </div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">
      <span class="sync-status" id="sync-status"><i class="ti ti-cloud"></i> <span id="sync-label">Loading…</span></span>
      <button class="btn" onclick="goToday()"><i class="ti ti-calendar-today"></i> Today</button>
      <button class="btn btn-accent" onclick="openAddModal()"><i class="ti ti-plus"></i> Add habit</button>
    </div>
  </header>

  <div class="card" style="margin-bottom:16px">
    <div class="card-inner">
      <div class="section-header">
        <div class="month-nav">
          <button class="btn" onclick="changeMonth(-1)" aria-label="Previous month"><i class="ti ti-chevron-left"></i></button>
          <span class="month-label" id="month-label"></span>
          <button class="btn" onclick="changeMonth(1)" aria-label="Next month"><i class="ti ti-chevron-right"></i></button>
        </div>
      </div>
      <div class="stats-grid" id="stats"></div>
    </div>
  </div>

  <div class="card">
    <div class="table-wrap">
      <table id="tracker-table" aria-label="Habit tracker">
        <thead id="thead"></thead>
        <tbody id="tbody"></tbody>
      </table>
      <div id="empty-state" style="display:none" class="empty-state">
        <i class="ti ti-playlist-add"></i>
        <p>No habits yet. Click <strong>Add habit</strong> to get started.</p>
      </div>
    </div>
  </div>
</div>

<div class="modal-bg" id="modal-bg" role="dialog" aria-modal="true" aria-labelledby="modal-title">
  <div class="modal">
    <h2 id="modal-title">Add habit</h2>
    <div class="field">
      <label for="habit-name-input">Habit name</label>
      <input type="text" id="habit-name-input" placeholder="e.g. Drink 8 glasses of water" maxlength="60" />
    </div>
    <div class="field">
      <label>Applicable days</label>
      <div class="day-grid" id="day-grid"></div>
      <p class="field-hint">Deselect days when this habit doesn't apply (e.g. gym on weekdays only)</p>
    </div>
    <div class="modal-footer">
      <button class="btn" onclick="closeModal()">Cancel</button>
      <button class="btn btn-accent" id="modal-save-btn" onclick="saveHabit()">Add habit</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = 'https://uawyqqrogqnkaxzxyovp.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVhd3lxcXJvZ3Fua2F4enh5b3ZwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODEyNjAyNDQsImV4cCI6MjA5NjgzNjI0NH0.419FA04zJp4Qif2q4NEoNrHS5V-Sjl4_NrZZH4FUBuQ';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const DAY_NAMES = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];

const today = new Date();
let curYear = today.getFullYear(), curMonth = today.getMonth();
let editingId = null, dragSrc = null, modalDays = [0,1,2,3,4,5,6];
let habits = [], checks = {};

function setSyncStatus(state, text) {
  const el = document.getElementById('sync-status');
  el.className = 'sync-status ' + state;
  const icons = { syncing: 'ti-loader-2', synced: 'ti-cloud-check', error: 'ti-cloud-x' };
  el.querySelector('i').className = 'ti ' + (icons[state] || 'ti-cloud');
  el.querySelector('i').style.animation = state === 'syncing' ? 'spin 1s linear infinite' : '';
  document.getElementById('sync-label').textContent = text;
}

async function loadAll() {
  setSyncStatus('syncing', 'Loading…');
  try {
    const [{ data: hData, error: hErr }, { data: cData, error: cErr }] = await Promise.all([
      sb.from('habits').select('*').order('created_at', { ascending: true }),
      sb.from('checks').select('*')
    ]);
    if (hErr) throw hErr;
    if (cErr) throw cErr;

    habits = hData.map(r => ({ id: r.id, name: r.name, days: JSON.parse(r.days) }));
    checks = {};
    cData.forEach(r => {
      const [y, m, d] = r.checked_date.split('-').map(Number);
      checks[checkKey(r.habit_id, y, m - 1, d)] = r.id;
    });
    setSyncStatus('synced', 'Synced');
  } catch (e) {
    console.error(e);
    setSyncStatus('error', 'Load failed');
  }
  document.getElementById('loading-overlay').style.display = 'none';
  render();
}

async function dbAddHabit(name, days) {
  const { data, error } = await sb.from('habits').insert({ name, days: JSON.stringify(days) }).select().single();
  if (error) throw error;
  return data;
}
async function dbUpdateHabit(id, name, days) {
  const { error } = await sb.from('habits').update({ name, days: JSON.stringify(days) }).eq('id', id);
  if (error) throw error;
}
async function dbDeleteHabit(id) {
  await sb.from('checks').delete().eq('habit_id', id);
  const { error } = await sb.from('habits').delete().eq('id', id);
  if (error) throw error;
}
async function dbAddCheck(habitId, y, m, d) {
  const dateStr = `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
  const { data, error } = await sb.from('checks').insert({ habit_id: habitId, checked_date: dateStr }).select().single();
  if (error) throw error;
  return data;
}
async function dbDeleteCheck(rowId) {
  const { error } = await sb.from('checks').delete().eq('id', rowId);
  if (error) throw error;
}

function checkKey(hid, y, m, d) { return `${hid}_${y}_${m}_${d}`; }
function getDaysInMonth(y, m) { return new Date(y, m+1, 0).getDate(); }
function isApplicable(habit, dow) { return habit.days.includes(dow); }

async function toggleCheck(hid, y, m, d) {
  const k = checkKey(hid, y, m, d);
  setSyncStatus('syncing', 'Saving…');
  try {
    if (checks[k]) {
      const rowId = checks[k];
      delete checks[k];
      render();
      await dbDeleteCheck(rowId);
    } else {
      checks[k] = 'pending';
      render();
      const row = await dbAddCheck(hid, y, m, d);
      checks[k] = row.id;
    }
    setSyncStatus('synced', 'Synced');
  } catch (e) {
    console.error(e);
    setSyncStatus('error', 'Save failed');
    if (checks[k] === 'pending') delete checks[k];
    render();
  }
}

function render() {
  const days = getDaysInMonth(curYear, curMonth);
  document.getElementById('month-label').textContent = `${MONTHS[curMonth]} ${curYear}`;
  document.getElementById('empty-state').style.display = habits.length === 0 ? 'block' : 'none';

  let th = `<tr><th class="habit-col">Habit</th>`;
  for (let d = 1; d <= days; d++) {
    const dow = new Date(curYear, curMonth, d).getDay();
    const isT = d === today.getDate() && curMonth === today.getMonth() && curYear === today.getFullYear();
    th += `<th class="${isT ? 'today-header' : ''}">${DAY_NAMES[dow]}<br/>${d}</th>`;
  }
  th += `<th style="min-width:90px">Progress</th></tr>`;
  document.getElementById('thead').innerHTML = th;

  const tbody = document.getElementById('tbody');
  tbody.innerHTML = '';
  let totalPossible = 0, totalDone = 0;

  habits.forEach(h => {
    let done = 0, possible = 0;
    for (let d = 1; d <= days; d++) {
      const dow = new Date(curYear, curMonth, d).getDay();
      if (isApplicable(h, dow)) {
        possible++;
        if (checks[checkKey(h.id, curYear, curMonth, d)]) done++;
      }
    }
    totalPossible += possible; totalDone += done;
    const pct = possible > 0 ? Math.round(done / possible * 100) : 0;

    const tr = document.createElement('tr');
    tr.dataset.id = h.id;
    tr.setAttribute('draggable', 'true');
    tr.addEventListener('dragstart', () => { dragSrc = h.id; tr.style.opacity = '.45'; });
    tr.addEventListener('dragend', () => { tr.style.opacity = '1'; tr.classList.remove('drag-over'); });
    tr.addEventListener('dragover', e => { e.preventDefault(); tr.classList.add('drag-over'); });
    tr.addEventListener('dragleave', () => tr.classList.remove('drag-over'));
    tr.addEventListener('drop', e => {
      e.preventDefault(); tr.classList.remove('drag-over');
      if (dragSrc === h.id) return;
      const fi = habits.findIndex(x => x.id === dragSrc);
      const ti = habits.findIndex(x => x.id === h.id);
      if (fi < 0 || ti < 0) return;
      const [removed] = habits.splice(fi, 1);
      habits.splice(ti, 0, removed);
      render();
    });

    const daysLabel = h.days.length === 7 ? 'Every day' : h.days.map(d => DAY_NAMES[d]).join(', ');
    const habitCell = document.createElement('td');
    habitCell.className = 'habit-cell';
    habitCell.innerHTML = `
      <div class="habit-name-row">
        <i class="ti ti-grip-vertical drag-handle" aria-hidden="true"></i>
        <span style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${escHtml(h.name)}</span>
        <div class="habit-actions">
          <button class="btn btn-ghost" style="padding:4px 7px;font-size:11px" onclick="openEditModal(${h.id})" title="Edit"><i class="ti ti-edit" aria-hidden="true"></i></button>
          <button class="btn btn-ghost btn-danger" style="padding:4px 7px;font-size:11px" onclick="deleteHabit(${h.id})" title="Delete"><i class="ti ti-trash" aria-hidden="true"></i></button>
        </div>
      </div>
      <div class="habit-sub">${daysLabel}</div>`;
    tr.appendChild(habitCell);

    for (let d = 1; d <= days; d++) {
      const dow = new Date(curYear, curMonth, d).getDay();
      const isT = d === today.getDate() && curMonth === today.getMonth() && curYear === today.getFullYear();
      const td = document.createElement('td');
      if (!isApplicable(h, dow)) {
        td.innerHTML = `<div class="cb na" aria-label="not applicable"></div>`;
      } else {
        const ck = checks[checkKey(h.id, curYear, curMonth, d)];
        const cbClass = `cb${ck ? ' checked' : ''}${isT ? ' today-col' : ''}`;
        td.innerHTML = `<div class="${cbClass}" role="checkbox" aria-checked="${!!ck}" tabindex="0"
          onclick="toggleCheck(${h.id},${curYear},${curMonth},${d})"
          onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();toggleCheck(${h.id},${curYear},${curMonth},${d})}"
          >${ck ? '<i class="ti ti-check" aria-hidden="true"></i>' : ''}</div>`;
      }
      tr.appendChild(td);
    }

    const ptd = document.createElement('td');
    ptd.className = 'progress-cell';
    ptd.innerHTML = `
      <div class="progress-bar-wrap"><div class="progress-bar" style="width:${pct}%"></div></div>
      <div class="pct-label">${done}/${possible} · ${pct}%</div>`;
    tr.appendChild(ptd);
    tbody.appendChild(tr);
  });

  const overallPct = totalPossible > 0 ? Math.round(totalDone / totalPossible * 100) : 0;
  document.getElementById('stats').innerHTML = `
    <div class="stat"><div class="stat-label">Overall completion</div><div class="stat-val">${overallPct}%</div></div>
    <div class="stat"><div class="stat-label">Check-ins this month</div><div class="stat-val">${totalDone}/${totalPossible}</div></div>
    <div class="stat"><div class="stat-label">Perfect days</div><div class="stat-val">${countCompletedDays()}</div></div>
    <div class="stat"><div class="stat-label">Current streak</div><div class="stat-val">${calcStreak()} day${calcStreak() === 1 ? '' : 's'}</div></div>
    <div class="stat"><div class="stat-label">Best day this month</div><div class="stat-val">${calcBestDay()}</div></div>`;
}

function escHtml(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

function calcStreak() {
  let s = 0; const d = new Date(today);
  for (let i = 0; i < 365; i++) {
    const y = d.getFullYear(), mo = d.getMonth(), day = d.getDate();
    let allDone = true, anyApplicable = false;
    habits.forEach(h => { if (isApplicable(h, d.getDay())) { anyApplicable = true; if (!checks[checkKey(h.id, y, mo, day)]) allDone = false; } });
    if (!anyApplicable || !allDone) break;
    s++; d.setDate(d.getDate() - 1);
  }
  return s;
}

function countCompletedDays() {
  const days = getDaysInMonth(curYear, curMonth); let count = 0;
  for (let d = 1; d <= days; d++) {
    const dow = new Date(curYear, curMonth, d).getDay();
    let allDone = true, anyApplicable = false;
    habits.forEach(h => { if (isApplicable(h, dow)) { anyApplicable = true; if (!checks[checkKey(h.id, curYear, curMonth, d)]) allDone = false; } });
    if (anyApplicable && allDone) count++;
  }
  return count;
}

function calcBestDay() {
  const days = getDaysInMonth(curYear, curMonth); let best = -1, bestDay = '—';
  for (let d = 1; d <= days; d++) {
    const dow = new Date(curYear, curMonth, d).getDay(); let done = 0, possible = 0;
    habits.forEach(h => { if (isApplicable(h, dow)) { possible++; if (checks[checkKey(h.id, curYear, curMonth, d)]) done++; } });
    if (possible > 0 && done > best) { best = done; bestDay = `${d} ${MONTHS[curMonth].slice(0,3)}`; }
  }
  return bestDay;
}

function changeMonth(delta) {
  curMonth += delta;
  if (curMonth < 0) { curMonth = 11; curYear--; }
  if (curMonth > 11) { curMonth = 0; curYear++; }
  render();
}
function goToday() { curYear = today.getFullYear(); curMonth = today.getMonth(); render(); }

function buildDayGrid(selected) {
  modalDays = [...selected];
  const dg = document.getElementById('day-grid');
  dg.innerHTML = '';
  DAY_NAMES.forEach((n, i) => {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'day-btn' + (selected.includes(i) ? ' active' : '');
    b.textContent = n;
    b.setAttribute('aria-pressed', selected.includes(i));
    b.onclick = () => {
      if (modalDays.includes(i)) { if (modalDays.length > 1) modalDays = modalDays.filter(x => x !== i); }
      else modalDays.push(i);
      buildDayGrid(modalDays);
    };
    dg.appendChild(b);
  });
}

function openAddModal() {
  editingId = null;
  document.getElementById('modal-title').textContent = 'Add habit';
  document.getElementById('modal-save-btn').textContent = 'Add habit';
  document.getElementById('habit-name-input').value = '';
  buildDayGrid([0,1,2,3,4,5,6]);
  document.getElementById('modal-bg').classList.add('open');
  setTimeout(() => document.getElementById('habit-name-input').focus(), 50);
}

function openEditModal(id) {
  const h = habits.find(x => x.id === id); if (!h) return;
  editingId = id;
  document.getElementById('modal-title').textContent = 'Edit habit';
  document.getElementById('modal-save-btn').textContent = 'Save changes';
  document.getElementById('habit-name-input').value = h.name;
  buildDayGrid([...h.days]);
  document.getElementById('modal-bg').classList.add('open');
  setTimeout(() => document.getElementById('habit-name-input').focus(), 50);
}

function closeModal() { document.getElementById('modal-bg').classList.remove('open'); }

async function saveHabit() {
  const name = document.getElementById('habit-name-input').value.trim();
  if (!name) { document.getElementById('habit-name-input').focus(); return; }
  const days = [...modalDays].sort();
  closeModal();
  setSyncStatus('syncing', 'Saving…');
  try {
    if (editingId !== null) {
      await dbUpdateHabit(editingId, name, days);
      const h = habits.find(x => x.id === editingId);
      if (h) { h.name = name; h.days = days; }
    } else {
      const row = await dbAddHabit(name, days);
      habits.push({ id: row.id, name: row.name, days: JSON.parse(row.days) });
    }
    setSyncStatus('synced', 'Synced'); render();
  } catch (e) {
    console.error(e); setSyncStatus('error', 'Save failed');
  }
}

async function deleteHabit(id) {
  const h = habits.find(x => x.id === id); if (!h) return;
  if (!confirm(`Delete "${h.name}"? This cannot be undone.`)) return;
  setSyncStatus('syncing', 'Deleting…');
  try {
    await dbDeleteHabit(id);
    habits = habits.filter(x => x.id !== id);
    Object.keys(checks).forEach(k => { if (k.startsWith(id + '_')) delete checks[k]; });
    setSyncStatus('synced', 'Synced'); render();
  } catch (e) {
    console.error(e); setSyncStatus('error', 'Delete failed');
  }
}

document.getElementById('modal-bg').addEventListener('click', e => { if (e.target === e.currentTarget) closeModal(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });
document.getElementById('habit-name-input').addEventListener('keydown', e => { if (e.key === 'Enter') saveHabit(); });

loadAll();
</script>
